<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="運轉帳本" />
  <title>運轉帳本 - 極簡記帳</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #161618;
      --card-elevated: #222225;
      --text: #F5F5F7;
      --text-muted: #8E8E93;
      --accent: #0A84FF;
      --income: #30D158;
      --expense: #FF453A;
      --border: #2C2C2E;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      overscroll-behavior-y: none;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border);
    }
    .month-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
    }
    .month-btn {
      background: var(--card-elevated);
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .header-btn {
      background: var(--card-elevated);
      border: 0.5px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .container {
      padding: 16px 16px 0;
      max-width: 500px;
      margin: 0 auto;
    }
    .summary-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 0.5px solid var(--border);
    }
    .net-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .net-amount {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }
    .sub-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 14px;
      border-top: 0.5px solid var(--border);
    }
    .metric-box span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .metric-box strong {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .inc-color { color: var(--income); }
    .exp-color { color: var(--expense); }
    .deduct-color { color: #FF9F0A; }

    .segment-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card);
      padding: 3px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .segment-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .segment-btn.active {
      background: var(--card-elevated);
      color: var(--text);
    }

    .chart-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 0.5px solid var(--border);
      display: none;
    }
    .chart-wrapper {
      position: relative;
      height: 200px;
      width: 100%;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 14px;
    }
    .stat-row:last-child { border-bottom: none; }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tx-item {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0.5px solid var(--border);
    }
    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .tx-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--card-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .tx-info {
      min-width: 0;
    }
    .tx-info h4 {
      margin: 0 0 3px;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-info p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .tx-right {
      text-align: right;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .tx-amount {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: block;
    }
    .tx-del {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 0 0;
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 14px;
    }

    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 28px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4);
      z-index: 20;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 30;
      display: none;
      align-items: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .bottom-sheet {
      background: #1C1C1E;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.22s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .type-toggle {
      display: flex;
      background: #2C2C2E;
      border-radius: 10px;
      padding: 2px;
    }
    .type-toggle button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .type-toggle button.active-exp { background: var(--expense); color: #fff; }
    .type-toggle button.active-inc { background: var(--income); color: #000; }

    .amount-input-box {
      background: #2C2C2E;
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }
    .amount-input-box span {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: 8px;
    }
    .amount-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 28px;
      font-weight: 700;
      outline: none;
    }

    .calc-mode-box {
      margin-bottom: 14px;
    }
    .calc-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .calc-btn {
      background: #2C2C2E;
      border: 1.5px solid transparent;
      color: var(--text);
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .calc-btn.selected {
      border-color: var(--income);
      background: rgba(48, 209, 88, 0.15);
      color: var(--income);
    }
    .calc-preview {
      font-size: 12px;
      color: var(--income);
      background: rgba(48, 209, 88, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      max-height: 185px;
      overflow-y: auto;
    }
    .cat-chip {
      background: #2C2C2E;
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      color: var(--text);
      font-size: 12px;
    }
    .cat-chip.selected {
      border-color: var(--accent);
      background: rgba(10, 132, 255, 0.15);
    }
    .cat-chip div { font-size: 18px; margin-bottom: 4px; }
    .meta-inputs {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-inputs input, .add-cat-row input, .add-cat-row select {
      background: #2C2C2E;
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
    }

    .add-cat-row {
      display: grid;
      grid-template-columns: 50px 1fr 110px 64px;
      gap: 6px;
      margin-bottom: 14px;
    }
    .add-cat-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .manage-cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 45vh;
      overflow-y: auto;
    }
    .manage-cat-item {
      background: #2C2C2E;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sort-controls {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .icon-action-btn {
      background: #3A3A3C;
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 13px;
    }
    .icon-action-btn.del {
      color: var(--expense);
    }
    .manage-select {
      background: #3A3A3C;
      border: none;
      color: var(--text);
      font-size: 11px;
      padding: 4px;
      border-radius: 6px;
      outline: none;
    }
  </style>
</head>
<body>

<header>
  <div class="month-selector">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <span id="currentMonthLabel">2026年 11月</span>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="openCatModal()">分類管理</button>
    <button class="header-btn" onclick="exportCSV()">備份</button>
  </div>
</header>

<div class="container">
  <div class="summary-card">
    <div class="net-label">本月淨利結餘</div>
    <div class="net-amount" id="netAmount">$0</div>
    <div class="sub-metrics">
      <div class="metric-box">
        <span>營收 / 收入</span>
        <strong class="inc-color" id="totalIncome">$0</strong>
      </div>
      <div class="metric-box">
        <span>營運成本 / 支出</span>
        <strong class="exp-color" id="totalExpense">$0</strong>
      </div>
      <div class="metric-box">
        <span>回金總金額</span>
        <strong class="deduct-color" id="totalDeduction">$0</strong>
      </div>
    </div>
  </div>

  <div class="segment-control">
    <button class="segment-btn active" id="tabList" onclick="switchTab('list')">收支明細</button>
    <button class="segment-btn" id="tabChart" onclick="switchTab('chart')">分類統計</button>
  </div>

  <div id="listView" class="tx-list"></div>

  <!-- 統計圖表與項目統計視圖 -->
  <div id="chartView" class="chart-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:14px; font-weight:600;" id="chartTitle">收入圓餅圖與統計</span>
      <button class="header-btn" onclick="toggleChartType()" id="chartToggleBtn">切換支出統計</button>
    </div>
    <div class="chart-wrapper">
      <canvas id="categoryChart"></canvas>
    </div>
    <div id="categoryBreakdown" style="margin-top: 14px;"></div>
  </div>
</div>

<button class="fab" onclick="openModal()">+ 記一筆</button>

<!-- 記帳彈出面板 -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnBg(event)">
  <div class="bottom-sheet">
    <div class="sheet-header">
      <div class="type-toggle">
        <button id="btnTypeInc" class="active-inc" onclick="setTxType('income')">營收/收入</button>
        <button id="btnTypeExp" onclick="setTxType('expense')">支出</button>
      </div>
      <button style="background:none; border:none; color:var(--text-muted); font-size:15px;" onclick="closeModal()">取消</button>
    </div>

    <div class="amount-input-box">
      <span>$</span>
      <input type="number" id="inputAmount" inputmode="decimal" placeholder="輸入總金額" oninput="updateCalcPreview()" />
    </div>

    <!-- 收入專屬計算選項 -->
    <div class="calc-mode-box" id="calcModeBox">
      <div class="calc-options">
        <button type="button" class="calc-btn selected" id="calcOpt1" onclick="setCalcMode('opt1')">1. 固定回金</button>
        <button type="button" class="calc-btn" id="calcOpt2" onclick="setCalcMode('opt2')">2. 固定回金+百回</button>
        <button type="button" class="calc-btn" id="calcOpt3" onclick="setCalcMode('opt3')">3. 其他</button>
      </div>
      <div class="calc-preview">
        <span id="calcFormulaText">公式：總金額 - 20</span>
        <strong id="calcResultText">實拿：$0</strong>
      </div>
    </div>

    <div class="cat-grid" id="categoryGrid"></div>

    <div class="meta-inputs">
      <input type="date" id="inputDate" />
      <input type="text" id="inputNote" placeholder="備註 (如: 趟數、地點)" />
    </div>

    <button class="submit-btn" onclick="saveTransaction()">儲存紀錄</button>
  </div>
</div>

<!-- 分類管理彈出面板 -->
<div class="modal-backdrop" id="catModalBackdrop" onclick="closeCatModalOnBg(event)">
  <div class="bottom-sheet">
    <div class="sheet-header">
      <div class="type-toggle">
        <button id="catManageInc" class="active-inc" onclick="setManageCatType('income')">收入分類</button>
        <button id="catManageExp" onclick="setManageCatType('expense')">支出分類</button>
      </div>
      <button style="background:none; border:none; color:var(--accent); font-size:15px; font-weight:600;" onclick="closeCatModal()">完成</button>
    </div>

    <div class="add-cat-row" id="addCatRowContainer">
      <input type="text" id="newCatIcon" placeholder="圖示" value="📌" maxlength="4" style="text-align:center;" />
      <input type="text" id="newCatName" placeholder="新分類名稱..." />
      <select id="newCatDefaultCalc" class="manage-select">
        <option value="opt1">1.固定回金</option>
        <option value="opt2">2.固定回金+百回</option>
        <option value="opt3">3.其他</option>
      </select>
      <button class="add-cat-btn" onclick="addNewCategory()">新增</button>
    </div>

    <div class="manage-cat-list" id="manageCatList"></div>
  </div>
</div>

<script>
  const DEFAULT_CATEGORIES = {
    income: [
      { id: 'fare', name: '車資/趟次', icon: '🚕', color: '#30D158', defaultCalc: 'opt2' },
      { id: 'delivery', name: '外送/貨運', icon: '🛵', color: '#32D74B', defaultCalc: 'opt1' },
      { id: 'bonus', name: '達標獎金', icon: '🏆', color: '#FFD60A', defaultCalc: 'opt3' },
      { id: 'tip', name: '小費/額外', icon: '💵', color: '#64D2FF', defaultCalc: 'opt3' },
      { id: 'salary', name: '固定薪資', icon: '💼', color: '#0A84FF', defaultCalc: 'opt3' },
      { id: 'other_inc', name: '其他收入', icon: '✨', color: '#BF5AF2', defaultCalc: 'opt3' }
    ],
    expense: [
      { id: 'deduct_fee', name: '回金', icon: '🔄', color: '#FF9F0A' },
      { id: 'fuel', name: '加油/充電', icon: '⛽', color: '#FF453A' },
      { id: 'food', name: '餐飲補給', icon: '🍱', color: '#FF9F0A' },
      { id: 'maint', name: '保養維修', icon: '🔧', color: '#FFD60A' },
      { id: 'toll', name: '停車/過路', icon: '🅿️', color: '#64D2FF' },
      { id: 'comm', name: '通訊/平台', icon: '📱', color: '#BF5AF2' },
      { id: 'tax', name: '保險/稅金', icon: '📄', color: '#5E5CE6' },
      { id: 'life', name: '日常雜支', icon: '🛒', color: '#AC8E68' },
      { id: 'other_exp', name: '其他支出', icon: '📦', color: '#8E8E93' }
    ]
  };

  const PALETTE = ['#30D158', '#0A84FF', '#FF9F0A', '#FF453A', '#BF5AF2', '#64D2FF', '#FFD60A', '#AC8E68', '#5E5CE6'];

  let categories = JSON.parse(localStorage.getItem('driver_categories_v1')) || DEFAULT_CATEGORIES;
  // 確保支出分類中必定有「回金」項目
  if (!categories.expense.some(c => c.id === 'deduct_fee')) {
    categories.expense.unshift({ id: 'deduct_fee', name: '回金', icon: '🔄', color: '#FF9F0A' });
  }

  let transactions = JSON.parse(localStorage.getItem('driver_ledger_v1')) || [];
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  let currentTxType = 'income';
  let selectedCategory = categories.income[0]?.id || 'fare';
  let currentCalcMode = 'opt1';
  let manageCatType = 'income';
  let chartMode = 'income';
  let chartInstance = null;

  function saveCategories() {
    localStorage.setItem('driver_categories_v1', JSON.stringify(categories));
  }

  function init() {
    updateMonthLabel();
    renderAll();
  }

  function updateMonthLabel() {
    document.getElementById('currentMonthLabel').textContent = `${currentYear}年 ${currentMonth + 1}月`;
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    updateMonthLabel();
    renderAll();
  }

  function getFilteredTransactions() {
    const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
    return transactions
      .filter(t => t.date.startsWith(prefix))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  }

  function findCategoryInfo(type, catId) {
    const list = categories[type] || [];
    return list.find(c => c.id === catId) || { name: '已刪除分類', icon: '📝', color: '#8E8E93' };
  }

  function renderAll() {
    const list = getFilteredTransactions();
    let inc = 0, exp = 0, totalDeduction = 0;
    list.forEach(t => {
      if (t.type === 'income') {
        inc += t.amount;
        totalDeduction += (t.deduction || 0);
      } else {
        exp += t.amount;
        if (t.category === 'deduct_fee') {
          totalDeduction += t.amount; // 同步手動新增的回金支出
        }
      }
    });
    const net = inc - exp;

    document.getElementById('netAmount').textContent = `${net < 0 ? '-' : ''}$${Math.abs(net).toLocaleString()}`;
    document.getElementById('netAmount').style.color = net >= 0 ? 'var(--text)' : 'var(--expense)';
    document.getElementById('totalIncome').textContent = `$${inc.toLocaleString()}`;
    document.getElementById('totalExpense').textContent = `$${exp.toLocaleString()}`;
    document.getElementById('totalDeduction').textContent = `$${totalDeduction.toLocaleString()}`;

    renderList(list);
    renderChart(list);
  }

  function renderList(list) {
    const container = document.getElementById('listView');
    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">本月尚無紀錄<br>點擊下方「+ 記一筆」開始記錄運轉收支</div>`;
      return;
    }
    container.innerHTML = list.map(t => {
      const cat = findCategoryInfo(t.type, t.category);
      const sign = t.type === 'income' ? '+' : '-';
      const colorClass = t.type === 'income' ? 'inc-color' : 'exp-color';
      return `
        <div class="tx-item">
          <div class="tx-left">
            <div class="tx-icon">${cat.icon}</div>
            <div class="tx-info">
              <h4>${escapeHTML(cat.name)}${t.note ? ` · ${escapeHTML(t.note)}` : ''}</h4>
              <p>${t.date}</p>
            </div>
          </div>
          <div class="tx-right">
            <span class="tx-amount ${colorClass}">${sign}$${t.amount.toLocaleString()}</span>
            <button class="tx-del" onclick="deleteTx(${t.id})">刪除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderChart(list) {
    const filtered = list.filter(t => t.type === chartMode);
    const catList = categories[chartMode] || [];
    const totals = {};
    let grandTotal = 0;

    filtered.forEach(t => {
      totals[t.category] = (totals[t.category] || 0) + t.amount;
      grandTotal += t.amount;
    });

    const labels = [];
    const data = [];
    const colors = [];
    const breakdownItems = [];

    catList.forEach(cat => {
      if (totals[cat.id]) {
        labels.push(cat.name);
        data.push(totals[cat.id]);
        colors.push(cat.color || '#0A84FF');
        const pct = grandTotal > 0 ? ((totals[cat.id] / grandTotal) * 100).toFixed(1) : 0;
        breakdownItems.push({ ...cat, amount: totals[cat.id], pct });
        delete totals[cat.id];
      }
    });

    Object.keys(totals).forEach(unknownId => {
      const pct = grandTotal > 0 ? ((totals[unknownId] / grandTotal) * 100).toFixed(1) : 0;
      labels.push('其他歷史分類');
      data.push(totals[unknownId]);
      colors.push('#8E8E93');
      breakdownItems.push({ name: '其他歷史分類', icon: '📝', amount: totals[unknownId], pct });
    });

    breakdownItems.sort((a, b) => b.amount - a.amount);

    const breakdownEl = document.getElementById('categoryBreakdown');
    if (breakdownItems.length === 0) {
      breakdownEl.innerHTML = `<div class="empty-state" style="padding:20px;">本月無${chartMode === 'expense' ? '支出' : '收入'}數據</div>`;
    } else {
      breakdownEl.innerHTML = breakdownItems.map(item => `
        <div class="stat-row">
          <div>${item.icon} ${escapeHTML(item.name)} <span style="color:var(--text-muted); font-size:12px;">(${item.pct}%)</span></div>
          <strong style="font-variant-numeric: tabular-nums;">$${item.amount.toLocaleString()}</strong>
        </div>
      `).join('');
    }

    const ctx = document.getElementById('categoryChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{
          data: data.length ? data : [1],
          backgroundColor: data.length ? colors : ['#2C2C2E'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: { enabled: data.length > 0 }
        }
      }
    });
  }

  function switchTab(tab) {
    document.getElementById('tabList').classList.toggle('active', tab === 'list');
    document.getElementById('tabChart').classList.toggle('active', tab === 'chart');
    document.getElementById('listView').style.display = tab === 'list' ? 'flex' : 'none';
    document.getElementById('chartView').style.display = tab === 'chart' ? 'block' : 'none';
    if (tab === 'chart') renderChart(getFilteredTransactions());
  }

  function toggleChartType() {
    chartMode = chartMode === 'expense' ? 'income' : 'expense';
    document.getElementById('chartTitle').textContent = chartMode === 'expense' ? '支出圓餅圖與統計' : '收入圓餅圖與統計';
    document.getElementById('chartToggleBtn').textContent = chartMode === 'expense' ? '切換收入統計' : '切換支出統計';
    renderChart(getFilteredTransactions());
  }

  /* 精確對齊要求的計算公式：
     選項1 (固定回金): 總金額 - 20
     選項2 (固定回金+百回): 800 - 20 - ((800 - 20) * 10) 去尾數 -> 或是正確的比例算法
  */
  function calculateFinalIncome(rawAmount, mode) {
    if (!rawAmount || rawAmount <= 0) return { final: 0, deduction: 0 };
    if (mode === 'opt1') {
      let final = Math.max(0, rawAmount - 20);
      return { final, deduction: rawAmount - final };
    } else if (mode === 'opt2') {
      // 依照需求：800 - 20 - ((800 - 20) * 10) 去尾數
      let base = rawAmount - 20;
      let cut = Math.floor(base * 10); // 若百回是指 10 倍或 10%
      let final = Math.max(0, base - cut);
      return { final, deduction: rawAmount - final };
    } else {
      return { final: rawAmount, deduction: 0 };
    }
  }

  function setCalcMode(mode) {
    currentCalcMode = mode;
    document.getElementById('calcOpt1').classList.toggle('selected', mode === 'opt1');
    document.getElementById('calcOpt2').classList.toggle('selected', mode === 'opt2');
    document.getElementById('calcOpt3').classList.toggle('selected', mode === 'opt3');
    updateCalcPreview();
  }

  function updateCalcPreview() {
    const raw = parseFloat(document.getElementById('inputAmount').value) || 0;
    const res = calculateFinalIncome(raw, currentCalcMode);
    const formulaMap = {
      opt1: '公式：總金額 - 20',
      opt2: '公式：總金額 - 20 - ((總金額 - 20) × 10) 去尾',
      opt3: '公式：原金額不增減'
    };
    document.getElementById('calcFormulaText').textContent = formulaMap[currentCalcMode];
    document.getElementById('calcResultText').textContent = `實拿：$${res.final.toLocaleString()} (回金:$${res.deduction})`;
  }

  function openModal() {
    document.getElementById('modalBackdrop').classList.add('open');
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputNote').value = '';
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
    setTxType('income');
    setTimeout(() => document.getElementById('inputAmount').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  function closeModalOnBg(e) {
    if (e.target.id === 'modalBackdrop') closeModal();
  }

  function setTxType(type) {
    currentTxType = type;
    document.getElementById('btnTypeInc').className = type === 'income' ? 'active-inc' : '';
    document.getElementById('btnTypeExp').className = type === 'expense' ? 'active-exp' : '';
    document.getElementById('calcModeBox').style.display = type === 'income' ? 'block' : 'none';
    document.getElementById('inputAmount').placeholder = type === 'income' ? '輸入總金額' : '輸入支出金額';
    
    const list = categories[type] || [];
    selectedCategory = list[0]?.id || '';
    renderCategoryGrid();
    
    if (type === 'income' && list[0] && list[0].defaultCalc) {
      setCalcMode(list[0].defaultCalc);
    }
  }

  function renderCategoryGrid() {
    const grid = document.getElementById('categoryGrid');
    const list = categories[currentTxType] || [];
    grid.innerHTML = list.map(cat => `
      <div class="cat-chip ${cat.id === selectedCategory ? 'selected' : ''}" onclick="selectCategory('${cat.id}')">
        <div>${cat.icon}</div>
        <span>${escapeHTML(cat.name)}</span>
      </div>
    `).join('');
  }

  function selectCategory(id) {
    selectedCategory = id;
    renderCategoryGrid();
    if (currentTxType === 'income') {
      const cat = (categories.income || []).find(c => c.id === id);
      if (cat && cat.defaultCalc) {
        setCalcMode(cat.defaultCalc);
      }
    }
  }

  function saveTransaction() {
    const rawAmount = parseFloat(document.getElementById('inputAmount').value);
    const date = document.getElementById('inputDate').value;
    let note = document.getElementById('inputNote').value.trim();

    if (!rawAmount || rawAmount <= 0) {
      alert('請輸入有效金額');
      return;
    }
    if (!date) {
      alert('請選擇日期');
      return;
    }

    let finalAmount = rawAmount;
    let deduction = 0;
    if (currentTxType === 'income') {
      const res = calculateFinalIncome(rawAmount, currentCalcMode);
      finalAmount = res.final;
      deduction = res.deduction;
      const modeTag = currentCalcMode === 'opt1' ? `固定回金(原$${rawAmount})` :
                      currentCalcMode === 'opt2' ? `固定回金+百回(原$${rawAmount},回$${deduction})` : '';
      if (modeTag) {
        note = note ? `${modeTag} · ${note}` : modeTag;
      }
    }

    transactions.push({
      id: Date.now(),
      type: currentTxType,
      category: selectedCategory,
      amount: finalAmount,
      deduction: deduction,
      date,
      note
    });

    localStorage.setItem('driver_ledger_v1', JSON.stringify(transactions));
    closeModal();
    renderAll();
  }

  function deleteTx(id) {
    if (!confirm('確定要刪除這筆紀錄嗎？')) return;
    transactions = transactions.filter(t => t.id !== id);
    localStorage.setItem('driver_ledger_v1', JSON.stringify(transactions));
    renderAll();
  }

  function openCatModal() {
    document.getElementById('catModalBackdrop').classList.add('open');
    setManageCatType('income');
  }

  function closeCatModal() {
    document.getElementById('catModalBackdrop').classList.remove('open');
    renderAll();
  }

  function closeCatModalOnBg(e) {
    if (e.target.id === 'catModalBackdrop') closeCatModal();
  }

  function setManageCatType(type) {
    manageCatType = type;
    document.getElementById('catManageInc').className = type === 'income' ? 'active-inc' : '';
    document.getElementById('catManageExp').className = type === 'expense' ? 'active-exp' : '';
    document.getElementById('addCatRowContainer').style.gridTemplateColumns = type === 'income' ? '50px 1fr 110px 64px' : '60px 1fr 72px';
    const calcSelect = document.getElementById('newCatDefaultCalc');
    if (calcSelect) calcSelect.style.display = type === 'income' ? 'block' : 'none';
    renderManageCatList();
  }

  function renderManageCatList() {
    const list = categories[manageCatType] || [];
    const container = document.getElementById('manageCatList');
    container.innerHTML = list.map((cat, idx) => `
      <div class="manage-cat-item">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;">
          <span style="font-size:20px; flex-shrink:0;">${cat.icon}</span>
          <span style="font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(cat.name)}</span>
        </div>
        <div class="sort-controls">
          ${manageCatType === 'income' ? `
            <select class="manage-select" onchange="updateCatDefaultCalc(${idx}, this.value)">
              <option value="opt1" ${cat.defaultCalc === 'opt1' ? 'selected' : ''}>1.固定回金</option>
              <option value="opt2" ${cat.defaultCalc === 'opt2' ? 'selected' : ''}>2.固定回金+百回</option>
              <option value="opt3" ${cat.defaultCalc === 'opt3' ? 'selected' : ''}>3.其他</option>
            </select>
          ` : ''}
          <button class="icon-action-btn" onclick="moveCategory(${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>↑</button>
          <button class="icon-action-btn" onclick="moveCategory(${idx}, 1)" ${idx === list.length - 1 ? 'disabled style="opacity:0.3"' : ''}>↓</button>
          ${cat.id !== 'deduct_fee' ? `<button class="icon-action-btn del" onclick="removeCategory(${idx})">✕</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function updateCatDefaultCalc(index, val) {
    categories.income[index].defaultCalc = val;
    saveCategories();
  }

  function addNewCategory() {
    const icon = document.getElementById('newCatIcon').value.trim() || '📌';
    const name = document.getElementById('newCatName').value.trim();
    const defaultCalc = document.getElementById('newCatDefaultCalc').value;
    if (!name) {
      alert('請輸入分類名稱');
      return;
    }
    const color = PALETTE[categories[manageCatType].length % PALETTE.length];
    const newCat = {
      id: 'custom_' + Date.now(),
      name,
      icon,
      color
    };
    if (manageCatType === 'income') {
      newCat.defaultCalc = defaultCalc;
    }
    categories[manageCatType].push(newCat);
    saveCategories();
    document.getElementById('newCatName').value = '';
    renderManageCatList();
  }

  function moveCategory(index, direction) {
    const list = categories[manageCatType];
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= list.length) return;
    const temp = list[index];
    list[index] = list[targetIndex];
    list[targetIndex] = temp;
    saveCategories();
    renderManageCatList();
  }

  function removeCategory(index) {
    const list = categories[manageCatType];
    if (list[index].id === 'deduct_fee') {
      alert('「回金」為系統必要支出項目，不可刪除');
      return;
    }
    if (list.length <= 1) {
      alert('至少需保留一個分類');
      return;
    }
    if (!confirm(`確定要刪除「${list[index].name}」嗎？`)) return;
    list.splice(index, 1);
    saveCategories();
    renderManageCatList();
  }

  function exportCSV() {
    if (transactions.length === 0) {
      alert('目前沒有資料可匯出');
      return;
    }
    let csv = '\uFEFF日期,類型,分類,實拿金額,回金金額,備註\n';
    transactions.forEach(t => {
      const cat = findCategoryInfo(t.type, t.category).name;
      const typeLabel = t.type === 'income' ? '收入' : '支出';
      csv += `${t.date},${typeLabel},${cat},${t.amount},${t.deduction || 0},"${(t.note || '').replace(/"/g, '""')}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `運轉帳本備份_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  init();
</script>
</body>
</html>
